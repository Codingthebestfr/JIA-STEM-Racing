<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b10">

    <title>{% block title %}JIA Racing{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <a class="skip-link" href="#main-content">Zum Inhalt springen</a>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <header class="navbar">

        <a class="logo" href="{{ url_for('home') }}" aria-label="JIA Racing Startseite">
            JIA<span>RACING</span>
        </a>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
            <span class="menu-icon" aria-hidden="true"></span>
            <span class="sr-only">Menü öffnen</span>
        </button>

        <nav id="site-navigation" aria-label="Hauptnavigation">
            <a class="{% if request.endpoint == 'home' %}is-active{% endif %}" href="{{ url_for('home') }}">Home</a>
            <a class="{% if request.endpoint == 'about' %}is-active{% endif %}" href="{{ url_for('about') }}">Über uns</a>
            <a class="{% if request.endpoint == 'team' %}is-active{% endif %}" href="{{ url_for('team') }}">Team</a>
            <a class="{% if request.endpoint == 'car' %}is-active{% endif %}" href="{{ url_for('car') }}">Unser Auto</a>
            <a class="{% if request.endpoint == 'project' %}is-active{% endif %}" href="{{ url_for('project') }}">Projekt</a>
            <a class="{% if request.endpoint == 'sponsors' %}is-active{% endif %}" href="{{ url_for('sponsors') }}">Sponsoren</a>
            <a class="{% if request.endpoint == 'contact' %}is-active{% endif %}" href="{{ url_for('contact') }}">Kontakt</a>
        </nav>

    </header>


    <!-- =========================
         HAUPTINHALT
    ========================== -->

    <main id="main-content" tabindex="-1">

        {% block content %}

        {% endblock %}

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="footer-content">

            <div>
                <h3>JIA Racing</h3>
                <p>
                    STEM Racing Team
                </p>
            </div>

            <div>
                <h3>Navigation</h3>

                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('about') }}">Über uns</a>
                <a href="{{ url_for('team') }}">Team</a>
                <a href="{{ url_for('car') }}">Auto</a>
            </div>

            <div>
                <h3>Kontakt</h3>

                <p>
                    Einhard-Gymnasium Aachen
                </p>

                <p>
                    STEM Racing 2026/27
                </p>
            </div>

        </div>

        <div class="copyright">
            © 2026 JIA Racing
        </div>

    </footer>

</body>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>

</body>

</html>
