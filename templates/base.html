<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}JIA STEM Racing{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <header class="navbar">

        <div class="logo">
            JIA<span>RACING</span>
        </div>

        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">Über uns</a>
            <a href="{{ url_for('team') }}">Team</a>
            <a href="{{ url_for('car') }}">Unser Auto</a>
            <a href="{{ url_for('project') }}">Projekt</a>
            <a href="{{ url_for('contact') }}">Kontakt</a>
        </nav>

    </header>


    <!-- =========================
         HAUPTINHALT
    ========================== -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="footer-content">

            <div>
                <h3>JIA RACING</h3>
                <p>
                    STEM Racing Team
                </p>
            </div>

            <div>
                <h3>Navigation</h3>

                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('about') }}">Über uns</a>
                <a href="{{ url_for('team') }}">Team</a>
                <a href="{{ url_for('car') }}">Auto</a>
            </div>

            <div>
                <h3>Kontakt</h3>

                <p>
                    Einhard-Gymnasium Aachen
                </p>

                <p>
                    STEM Racing 2026/27
                </p>
            </div>

        </div>

        <div class="copyright">
            © 2026 JIA Racing
        </div>

    </footer>

</body>

</html>


<nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('about') }}">Über uns</a>
    <a href="{{ url_for('team') }}">Team</a>
    <a href="{{ url_for('car') }}">Unser Auto</a>
    <a href="{{ url_for('project') }}">Projekt</a>
    <a href="{{ url_for('sponsors') }}">Sponsoren</a>
    <a href="{{ url_for('contact') }}">Kontakt</a>
</nav>
